# CPU
# CPU is AMD Ryzen 9 5900HX using amd-pstate-epp driver.
# CPU_MAX_PERF_ON_AC does not work on AMD — frequency is controlled via EPP policy.
# Governor must be set to powersave for amd-pstate-epp to function correctly.
CPU_SCALING_GOVERNOR_ON_AC=powersave              # required for amd-pstate-epp
CPU_SCALING_GOVERNOR_ON_BAT=powersave             # required for amd-pstate-epp
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance  # balanced performance on AC
CPU_ENERGY_PERF_POLICY_ON_BAT=power               # max power saving on battery
CPU_SCALING_MAX_FREQ_ON_AC=3500000   # hard cap at 3.5 GHz (in kHz)
CPU_SCALING_MAX_FREQ_ON_BAT=2000000  # hard cap at 2.0 GHz on battery

# Bluetooth — keep active to prevent audio cutouts (not excluded by default)
BLUETOOTH_AUTOSUSPEND=0

# Battery charge threshold — stop charging at 60% to preserve battery health
# Note: ASUS only supports stop threshold, start threshold is ignored
STOP_CHARGE_THRESH_BAT0=60
