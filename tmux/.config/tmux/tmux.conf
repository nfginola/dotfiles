# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# General
set -g default-shell /usr/bin/zsh
set -g history-limit 150000
set -g display-time 4000
set -sg escape-time 0
set -g renumber-windows on
set -g status-position bottom
set -g status-interval 7
set -g status-keys vi
set -g mode-keys vi
set -g mouse off

# Windows and panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind < swap-window -t -1 \; select-window -t -1
bind > swap-window -t +1 \; select-window -t +1
bind n previous-window
bind p next-window
bind k resize-pane -Z
bind y resize-pane -L 5
bind u resize-pane -D 5
bind i resize-pane -U 5
bind o resize-pane -R 5
bind m copy-mode
bind x confirm-before -p "Kill pane? (y/n)" kill-pane
bind \; display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs -I {} tmux switch-client -t {}"
bind * run-shell 'dir=$(tmux display-message -p "#{pane_current_path}"); tmux display-popup -E "cd \"$dir\" && $SHELL"' &>/dev/null || true
bind r source-file ~/.config/tmux/tmux.conf
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind P command-prompt -p "Pane name:" "select-pane -T '%%'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'

# High-contrast pane labels and borders.
set -g pane-border-status top
set -g pane-border-format '#[bold,fg=#{?pane_active,black,white},bg=#{?pane_active,brightgreen,blue}] #P: #{?pane_title,#T,#{pane_current_command}} #[default]'
setw -g pane-active-border-style fg=brightgreen
setw -g pane-border-style fg=brightblack

# Override any conflicting bindings for resize keys
unbind y
unbind u
unbind i
unbind o
bind y resize-pane -L 5
bind u resize-pane -D 5
bind i resize-pane -U 5
bind o resize-pane -R 5
