# Minimal picom configuration for visible compositing effects.

backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.18;
shadow-offset-x = -8;
shadow-offset-y = -8;

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

detect-rounded-corners = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 1.0; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
};
