[colors]
background = #1d2021
foreground = #ebdbb2
dim        = #928374

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 24
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = JetBrains Mono:size=10;2

modules-left   = i3
modules-center = date
modules-right  = ${env:POLYBAR_MODULES_RIGHT:volume}

separator = "  "
padding-right = 1

[module/i3]
type = internal/i3
pin-workspaces = true
label-focused = %name%
label-focused-foreground = #ebdbb2
label-focused-background = #504945
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1
label-urgent = %name%
label-urgent-foreground = #fb4934
label-urgent-padding = 1

[module/date]
type = internal/date
interval = 1
date = %A %d %B (%m/%Y)
time = %H:%M
label = %date%  %time%

[module/volume]
type = internal/pulseaudio
label-volume = vol %percentage%%
label-muted = vol muted
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = ${env:POLYBAR_BATTERY:BAT0}
adapter = ${env:POLYBAR_ADAPTER:AC}
full-at = 98
label-charging = bat %percentage%% ↑
label-discharging = bat %percentage%% ↓
label-full = bat full
