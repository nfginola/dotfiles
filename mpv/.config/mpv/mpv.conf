# Video
ytdl-format=bestvideo[height<=1440]+bestaudio/best  # cap stream quality at 1440p
fullscreen=yes                                       # start in fullscreen
hwdec=auto-safe                                      # hardware GPU decoding, reduces CPU load
keep-open=yes                                        # keep player open after video ends

# GPU
gpu-api=vulkan  # use Vulkan over OpenGL for better performance on modern GPUs

# Rendering
scale=ewa_lanczossharp      # high-quality upscaling filter (GPU-intensive, fine on 3070)
dscale=mitchell             # high-quality downscaling filter
cscale=ewa_lanczossharp     # high-quality chroma upscaling (improves color from 4:2:0 sources)
correct-downscaling=yes     # apply dscale filter when downscaling
sigmoid-upscaling=yes       # reduces ringing artifacts when upscaling
deband=yes                  # reduce color banding in compressed video
deband-iterations=4         # number of deband passes (higher = better, more GPU)
deband-threshold=48         # sensitivity to banding (higher = more aggressive)
deband-range=16             # radius of deband filter
tone-mapping=bt.2390        # HDR to SDR tonemapping for HDR content on SDR display

# Cache
cache=yes                           # enable caching
demuxer-max-bytes=1GiB              # forward buffer size
demuxer-max-back-bytes=500MiB       # backward buffer (seek back without re-download)
hr-seek-framedrop=yes               # drop frames during exact seeks to stay responsive

# OSD
osd-bar=yes         # show seekbar when scrubbing
osd-duration=2000   # keep OSD visible for 2 seconds

# Audio
volume=100  # default volume
